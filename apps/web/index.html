<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090f36">
  <meta name="description" content="Sahne Plus çok yakında. Yeteneklerin, yarışmaların ve eğlencenin yeni sahnesi hazırlanıyor.">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:title" content="Sahne Plus | Çok Yakında">
  <meta property="og:description" content="Yeteneklerin, yarışmaların ve eğlencenin yeni sahnesi hazırlanıyor.">
  <meta property="og:url" content="https://sahneplus.tr/">
  <link rel="canonical" href="https://sahneplus.tr/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Sahne Plus | Çok Yakında</title>
  <style>
    :root{color-scheme:dark;--white:#f8f9ff;--muted:#cfd4f0;--blue:#345fff;--purple:#9b29ff}
    *,*::before,*::after{box-sizing:border-box}
    html{min-height:100%;background:#050922}
    body{margin:0;min-height:100svh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--white);background:#060b29;overflow-x:hidden}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 44% 39% at 0 67%,#2051e152,transparent 78%),radial-gradient(ellipse 48% 49% at 100% 70%,#761fc84a,transparent 77%),radial-gradient(ellipse 40% 30% at 65% 26%,#303b9c54,transparent 90%),linear-gradient(155deg,#070a23 0%,#07143f 48%,#130f4e 76%,#05081f 100%);z-index:0}
    .stars{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;background-image:radial-gradient(1.2px 1.2px at 7% 11%,#ffffffcb 95%,transparent),radial-gradient(1px 1px at 21% 5%,#dadfff 95%,transparent),radial-gradient(1.4px 1.4px at 79% 7%,#ffffffb8 95%,transparent),radial-gradient(1.5px 1.5px at 89% 18%,#c5caff 95%,transparent),radial-gradient(1px 1px at 14% 35%,#899cffb0 95%,transparent),radial-gradient(1.2px 1.2px at 91% 42%,#bdc9ff9a 95%,transparent),radial-gradient(1px 1px at 69% 14%,#e5ddffb3 95%,transparent),radial-gradient(1px 1px at 43% 7%,#fff8 95%,transparent)}
    .shell{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;isolation:isolate;overflow:hidden}
    .arc{position:absolute;top:clamp(55px,8vh,105px);left:50%;width:min(1340px,159vw);height:clamp(170px,36vw,330px);transform:translateX(-50%);border-top:2px solid #cfd6ff;border-radius:50% 50% 0 0;box-shadow:0 -3px 7px #e0e1ffb8,0 -12px 27px #4f58ff9c,0 -26px 70px #343cff75;pointer-events:none;opacity:.95;z-index:1}
    .arc::before{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:130px;height:22px;background:radial-gradient(ellipse,#fff 1%,#b8aaff 15%,#7479ff76 40%,transparent 75%);filter:blur(3px)}
    .arc::after{content:"";position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 17px 6px #fff9,0 0 42px 18px #7674ff6b}
    .hero{position:relative;z-index:2;display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;width:min(100%,920px);padding:clamp(132px,18vh,194px) 24px 92px;text-align:center}
    .brand-icon{display:block;width:clamp(118px,15vw,172px);height:auto;aspect-ratio:1/1;border-radius:24%;box-shadow:0 18px 60px #0107287a,0 0 49px #6474ff24}
    .brand-name{margin:12px 0 0;font-weight:750;letter-spacing:-.065em;font-size:clamp(2.25rem,5vw,3.75rem);line-height:1.08;text-shadow:0 0 30px #718bff4a}
    .flare{position:relative;width:clamp(100px,24vw,225px);height:2px;margin:27px 0 34px;background:linear-gradient(90deg,transparent,#616bff,#f8f6ff,#7772ff,transparent);box-shadow:0 0 15px 2px #7675ffb6}
    .flare::before{content:"";position:absolute;left:50%;top:50%;width:22px;height:12px;transform:translate(-50%,-50%);background:#e6eaff;border-radius:50%;filter:blur(5px)}
    h1{font-size:clamp(3.4rem,9vw,6.65rem);line-height:1.03;font-weight:820;letter-spacing:-.072em;margin:0 0 24px;text-shadow:0 0 31px #8698ff4c}
    .subtitle{max-width:650px;margin:0;color:#e4e8ff;font-size:clamp(1.05rem,2.4vw,1.6rem);line-height:1.52;font-weight:390;text-wrap:balance;text-shadow:0 0 30px #6b74bb2a}
    .status{display:inline-flex;align-items:center;justify-content:center;min-width:min(100%,300px);margin-top:40px;padding:17px 42px;border:1.5px solid #d6dcff;border-radius:999px;background:linear-gradient(103deg,#175cf0 1%,#3447e8 43%,#871fe1 100%);font-size:clamp(1.03rem,2.2vw,1.32rem);font-weight:750;letter-spacing:.005em;color:#fff;box-shadow:0 0 0 2px #536fff53,0 0 22px #4d5bffb8,0 12px 48px #4a32e88c,inset 0 1px 10px #f4e7ff35;cursor:default;user-select:none}
    .tagline{display:flex;align-items:center;gap:18px;margin-top:45px;color:#e1e5ff;letter-spacing:.29em;font-size:.77rem;font-weight:600;text-transform:uppercase}
    .tagline::before,.tagline::after{content:"";width:38px;height:1px;background:linear-gradient(90deg,transparent,#c9d6ff)}
    .tagline::after{transform:rotate(180deg)}
    .floor{position:absolute;bottom:-88px;left:50%;transform:translateX(-50%);width:min(1500px,170%);height:270px;border-radius:50% 50% 0 0;background:radial-gradient(ellipse at 50% 3%,#d7a4ff86 0,#6b40d37a 8%,#3658b75a 17%,#16236052 35%,transparent 75%);pointer-events:none;z-index:1}
    .floor::before{content:"";position:absolute;top:0;left:0;width:100%;height:8px;background:linear-gradient(90deg,transparent 8%,#316ffb 26%,#a478ff 45%,#eab3ff 50%,#5b70ff 74%,transparent 92%);border-radius:50%;filter:blur(2px);box-shadow:0 0 24px #696affaa,0 0 44px #ba4aff99}
    footer{position:relative;z-index:3;width:100%;padding:18px 20px max(24px,env(safe-area-inset-bottom));text-align:center;color:#bec6f1ad;font-size:.8rem;letter-spacing:.02em}
    footer a{color:inherit;text-decoration:none}footer a:hover,footer a:focus-visible{color:#fff;text-decoration:underline}
    @media(max-width:600px){
      .arc{top:62px;width:175vw;height:175px}
      .hero{padding:clamp(150px,21vh,200px) 22px 96px;justify-content:center}
      .brand-icon{width:clamp(112px,34vw,148px)}
      .brand-name{font-size:clamp(2rem,9vw,2.85rem)}
      .flare{margin:24px 0 33px}
      h1{font-size:clamp(3.05rem,13vw,4.7rem);margin-bottom:21px}
      .subtitle{font-size:clamp(1.05rem,4.35vw,1.23rem);max-width:370px}
      .status{min-width:min(100%,275px);margin-top:36px;padding:16px 26px}
      .tagline{font-size:.58rem;letter-spacing:.19em;gap:8px;margin-top:35px}
      .tagline::before,.tagline::after{width:24px}
      .floor{height:180px;bottom:-75px}
      footer{font-size:.71rem}
    }
    @media(max-height:700px){.hero{padding-top:130px;padding-bottom:64px}.brand-icon{width:110px}.flare{margin:17px 0 22px}.status{margin-top:23px}.tagline{margin-top:22px}}
    @media(prefers-reduced-motion:no-preference){.arc::after{animation:glimmer 7s ease-in-out infinite}.flare::before{animation:pulse 6s ease-in-out infinite}@keyframes glimmer{0%,100%{opacity:.7}50%{opacity:1}}@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="stars" aria-hidden="true"></div>
    <div class="arc" aria-hidden="true"></div>
    <main class="hero">
      <img class="brand-icon" src="/favicon.svg" alt="Sahne Plus S+ logosu" width="172" height="172" fetchpriority="high">
      <p class="brand-name">Sahne Plus</p>
      <span class="flare" aria-hidden="true"></span>
      <h1>Çok Yakında</h1>
      <p class="subtitle">Yeteneklerin, yarışmaların ve eğlencenin yeni sahnesi hazırlanıyor.</p>
      <span class="status" aria-label="Sahne Plus yakında sizlerle">Yakında Sizlerle</span>
      <div class="tagline">Yeni Nesil Sahne Deneyimi</div>
    </main>
    <div class="floor" aria-hidden="true"></div>
    <footer>© 2026 Sahne Plus · <a href="https://aurainc.com.tr/" target="_blank" rel="noopener noreferrer">AURA Technology</a></footer>
  </div>
</body>
</html>
